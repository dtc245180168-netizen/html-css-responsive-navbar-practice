<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>
    <!-- Liên kết file CSS và JavaScript -->
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="logo">MyWebsite</div>
        <ul class="nav-links">
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Dịch vụ</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
        <div class="menu-icon">☰</div>
    </nav>

    <!-- Phần nội dung minh họa trang web -->
    <div class="main-content">
        <h1>Trang Web Responsive Navbar</h1>
        <p>Thu nhỏ trình duyệt (dưới 768px) hoặc kiểm tra trên thiết bị di động để thấy biểu tượng menu (☰) xuất hiện và hoạt động.</p>
    </div>

</body>
</html>
